name: Cypress E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run nocturne à 2h du matin (UTC) contre la prod, tous navigateurs
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    # Filet de sécurité : évite qu'un blocage réseau/install (ex. mirroir apt
    # muet) ne consomme des heures de minutes Actions avant d'échouer.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # max-parallel: 1 — les tests tapent sur le VPS de démo ZotoShop partagé
      # (petites ressources) : plusieurs jobs simultanés dessus peuvent le
      # surcharger et provoquer des timeouts réseau. On sérialise les navigateurs.
      max-parallel: 1
      matrix:
        browser: [chrome, firefox, edge]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      # Sur ubuntu-latest, le Firefox préinstallé est un paquet snap dont le
      # sandbox casse le pilotage headless (Cypress ne peut pas s'y connecter
      # en CDP/marionette). On installe un vrai binaire via cette action dédiée.
      - name: Installer un Firefox non-snap
        if: matrix.browser == 'firefox'
        uses: browser-actions/setup-firefox@v1
        with:
          # ESR (Extended Support Release) plutôt que "latest" : version stable
          # dont le protocole marionette est éprouvé avec le driver Cypress.
          firefox-version: latest-esr

      # Régression connue des runners ubuntu-latest récents : AppArmor bloque
      # les namespaces utilisateur non privilégiés, ce qui casse le sandbox de
      # Firefox ("CanCreateUserNamespace() unshare(CLONE_NEWPID): EPERM").
      - name: Autoriser le sandbox Firefox (namespaces non privilégiés)
        if: matrix.browser == 'firefox'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Lancer les tests Cypress (${{ matrix.browser }})
        uses: cypress-io/github-action@v6
        with:
          browser: ${{ matrix.browser }}

      - name: Archiver captures d'écran (si échec)
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cypress-screenshots-${{ matrix.browser }}
          path: cypress/screenshots
          if-no-files-found: ignore

      - name: Archiver vidéos
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cypress-videos-${{ matrix.browser }}
          path: cypress/videos
          if-no-files-found: ignore
